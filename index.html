<script>
    // ======================= DeepSeek 配置 =======================
    const DEEPSEEK_API_KEY = "sk-2d423e4a02d84a84b6fb5215c7dfabc6";
    const DEEPSEEK_URL = "https://api.deepseek.com/v1/chat/completions";
    
    async function callDeepSeek(messages, temperature = 0.7) {
        try {
            const response = await fetch(DEEPSEEK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: messages,
                    temperature: temperature,
                    max_tokens: 800,
                    stream: false
                })
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API 错误 ${response.status}: ${errText}`);
            }
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            console.error("DeepSeek调用失败:", error);
            return null;
        }
    }
    
    // ======================= 生成50+任务库（阅读理解均≥80字）=======================

    const readingPassagesLong = [
        "在中国古代四大发明中，造纸术的发明对人类文明进程产生了深远影响。早在西汉时期，中国就已经出现了植物纤维纸。东汉时期，蔡伦改进了造纸术，利用树皮、麻头、破布、旧渔网等原料制造出轻便且成本低廉的纸张，大大促进了文化的传播与保存。造纸术后来经由阿拉伯世界传入欧洲，为欧洲文艺复兴运动奠定了重要物质基础。",
        "大熊猫是世界上最珍贵的濒危动物之一，被称为“活化石”。它们主要生活在中国四川、陕西和甘肃的山区竹林中，以竹子为主食，一只成年大熊猫每天需要花费约14个小时进食，吃掉12至38公斤的竹子。由于繁殖率低和栖息地破坏，野生大熊猫数量曾一度锐减。近年来，通过建立自然保护区和人工繁育计划，大熊猫的保护状况有了显著改善，世界自然保护联盟已将其从“濒危”降为“易危”等级。",
        "青藏高原是世界上海拔最高的高原，平均海拔超过4000米，素有“世界屋脊”和“地球第三极”之称。这里拥有独特的自然景观和生态系统，如雄伟的喜马拉雅山脉、辽阔的羌塘草原以及众多的咸水湖。青藏高原也是长江、黄河、澜沧江等亚洲大江大河的发源地，因此被称为“亚洲水塔”。这里的珍稀动物包括藏羚羊、野牦牛、雪豹等，它们适应了高寒缺氧的极端环境。",
        "人工智能（AI）技术近年来发展迅猛，正在深刻改变我们的生产生活方式。从智能手机中的语音助手到自动驾驶汽车，从医疗影像诊断到个性化教育推荐，AI的应用场景越来越广泛。机器学习、深度学习等技术的突破使得AI能够处理更加复杂的任务。然而，AI也带来了隐私安全、就业结构变化以及伦理道德等方面的挑战，各国政府和科研机构正在积极制定相应的法律法规和技术标准，以确保AI技术健康有序发展。",
        "《论语》是儒家学派的经典著作，主要记录了孔子及其弟子的言行，集中体现了孔子的政治主张、伦理思想、道德观念及教育原则。全书共20篇，约1.6万字，语言简练而含义深刻，其中“己所不欲，勿施于人”“学而不思则罔，思而不学则殆”等名句至今仍被广泛引用。两千多年来，《论语》一直是中华民族文化传承的重要载体，对东亚乃至世界文明都产生了深远影响。",
        "全球气候变化是当今人类面临的最严峻挑战之一。由于化石燃料燃烧和森林砍伐等活动，大气中二氧化碳等温室气体浓度持续上升，导致全球平均温度升高、冰川加速融化、海平面上升以及极端天气事件频发。为了应对气候变化，各国在2015年通过了《巴黎协定》，承诺将本世纪全球气温上升幅度控制在2摄氏度以内，并努力限制在1.5摄氏度以内。实现这一目标需要全球范围内向清洁能源转型。",

        "郑和下西洋是明代永乐、宣德年间的一场海上远航活动，由三宝太监郑和率领。从1405年到1433年，郑和七次远航，最远到达东非沿岸，访问了亚洲和非洲30多个国家和地区。郑和船队规模庞大，最多时拥有船只200余艘，船员近3万人。这些远航促进了中国与亚非国家的贸易往来和文化交流，展示了明朝的国威和海洋实力。郑和下西洋比哥伦布发现新大陆早了近90年，是古代世界规模最大的航海活动。",
        "中国古代的长城是人类文明史上最宏伟的军事防御工程之一。长城始建于春秋战国时期，当时各国为互相防御而修筑城墙。秦始皇统一六国后，将各国的长城连接和扩建，形成了“万里长城”。此后，汉、明等朝代又多次修缮和增建。明代长城全长约8850公里，东起辽宁虎山，西至甘肃嘉峪关，经过多个省份。长城不仅具有军事防御功能，还促进了边疆地区的开发和民族融合。1987年，长城被列入世界文化遗产名录。"

    const TASK_POOL = [];

            thinkingProcess: `💡 **思维过程参考**：\n1. 两边同时除以${a}得到 x+${b} = ${c/a}\n2. 移项得 x = ${c/a} - ${b} = ${solution}\n3. 代入原方程检验，结果正确。\n元认知要点：注意分配律和符号。`,

    // 新增：DeepSeek 评判函数，根据三个元认知问答给出0-10分评分
    async function evaluateAnswersWithDeepSeek(task, qaLogs) {
        if (!qaLogs || qaLogs.length < 3) return null;
        const answers = qaLogs.map((log, idx) => `问题${idx+1}: ${log.question}\n回答: ${log.answer}`).join("\n\n");
        const systemPrompt = `你是元认知能力评估专家。根据初一学生对三个元认知问题的回答，分别评估其"计划能力"、"监控能力"、"评估调节能力"，每项0-10分。请只返回JSON格式：{"plan": 分数, "monitor": 分数, "evaluate": 分数, "comment": "简要评语(20字以内)"}。不要有其他文字。`;
        const userContent = `任务类型: ${task.type}\n学生的回答:\n${answers}`;
        try {
            const response = await callDeepSeek([
                { role: "system", content: systemPrompt },
                { role: "user", content: userContent }
            ], 0.5);
            if (response) {
                const jsonMatch = response.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    const result = JSON.parse(jsonMatch[0]);
                    if (typeof result.plan === 'number' && typeof result.monitor === 'number' && typeof result.evaluate === 'number') {
                        return result;
                    }
                }
            }
        } catch (e) { console.error("评判解析失败", e); }
        // 兜底：基于关键词简单评分
        let planScore = 0, monitorScore = 0, evalScore = 0;
        for (let idx = 0; idx < qaLogs.length; idx++) {
            const text = qaLogs[idx].answer.toLowerCase();
            if (idx === 0 && /计划|打算|先做|第一步|策略/.test(text)) planScore = 8;
            else if (idx === 0) planScore = 4;
            if (idx === 1 && /卡住|犹豫|检查|换方法|回头/.test(text)) monitorScore = 8;
            else if (idx === 1) monitorScore = 4;
            if (idx === 2 && /检验|评估|改进|下次|调整/.test(text)) evalScore = 8;
            else if (idx === 2) evalScore = 4;
        }
        return { plan: planScore, monitor: monitorScore, evaluate: evalScore, comment: "基于关键词初步评估" };
    }
    
    async function saveCompletedTaskWithEval(record, task, answer, qaLogs, roundId) {
        // 调用 AI 评判
        const aiScore = await evaluateAnswersWithDeepSeek(task, qaLogs);
        const taskRecord = {
            taskId: task.id,
            taskType: task.type,
            taskDescription: task.description,
            correctAnswer: task.correctAnswer,
            thinkingProcess: task.thinkingProcess,
            studentAnswer: answer,
            qaInteractions: qaLogs,
            completedAt: new Date().toISOString(),
            roundId: roundId,
            aiEvaluation: aiScore || { plan: 0, monitor: 0, evaluate: 0, comment: "评判失败" }
        };
        record.tasksCompleted.push(taskRecord);
        const nextTask = getRandomTask();
        record.currentTaskId = nextTask.id;
        record.currentRoundId = (record.currentRoundId || 1) + 1;
        saveAllData();
        return nextTask;
    }

    async function generateDeepSeekFeedback(question, studentAnswer, task, stepIdx, previousInteractions, fullConversationContext) {
        const systemPrompt = `你是思维小教练“小思”，专门训练初一学生的元认知监控能力。你的风格是亲切、鼓励、有逻辑。你需要根据学生的回答给出具体反馈，包含：
1. 对学生回答中体现的元认知能力（计划、监控、评估）给予认可。
2. 如果缺失某些环节，给予温和建议。
3. 提供一个可操作的“微行动”建议（一句话）。
回复要简洁有力，不超过150字。不要直接给出答案，而是引导学生反思。`;
        let messages = [
            { role: "system", content: systemPrompt },
            { role: "user", content: `当前任务类型: ${task.type}
元认知问题(${stepIdx+1}/3): ${question}
学生回答: ${studentAnswer}
之前的元认知交互记录: ${JSON.stringify(previousInteractions.slice(-2))}
请根据以上内容，以教练身份给出反馈。` }
        ];
        const recentContext = fullConversationContext.slice(-6);
        if (recentContext.length > 0) {
            messages.push({ role: "user", content: `最近的对话上下文：${recentContext.map(m => `${m.sender}:${m.text.substring(0,80)}`).join("; ")}` });
        }
        const aiResponse = await callDeepSeek(messages, 0.8);
        return aiResponse || "你的思考很有价值！继续加油～";
    }

    async function handleUserMessage() {
        if (isProcessing) return;
        if (!currentStudentId) { coachSay("请先点击「切换学号」设置学号开始训练。"); return; }
        const text = messageInput.value.trim();
        if (text === "") return;
        userSay(text);
        messageInput.value = "";
        if (currentStage === "TASK_PUBLISHED") {
            latestTaskAnswer = text;
            coachSay("📝 已记录你的解答。确认无误后请点击 **「任务完成」** 按钮，我将开始元认知提问。");
            isProcessing = false;
            return;
        }
        if (currentStage === "METACOG_ACTIVE" && waitingForUserResponse) {
            const currentQuestion = currentMetacogQuestions[metacogStepIndex];
            const previousInteractions = [...currentQaLogs];
            coachSay("⏳ 小思正在思考...", "");
            const feedback = await generateDeepSeekFeedback(currentQuestion, text, currentTaskObject, metacogStepIndex, previousInteractions, fullConversationHistory());
            const lastMsg = chatArea.lastChild;
            if (lastMsg && lastMsg.innerText.includes("小思正在思考")) lastMsg.remove();
            coachSay(feedback);
            currentQaLogs.push({ question: currentQuestion, answer: text, feedback: feedback });
            metacogStepIndex++;
            waitingForUserResponse = false;
            await askNextMetacogQuestion();
            isProcessing = false;
            return;
        }
        if (currentStage === "METACOG_ACTIVE" && !waitingForUserResponse) {
            coachSay("⏳ 请稍等，我正在准备下一个元认知问题。");
        }
        isProcessing = false;
    }

    function exportAnalysisReport() {
        const report = [];
        for (let sid in allStudentsData) {
            const st = allStudentsData[sid];
            let totalTasks = st.tasksCompleted.length;
            let sumPlan = 0, sumMonitor = 0, sumEval = 0;
            let valid = 0;
            for (let task of st.tasksCompleted) {
                if (task.aiEvaluation && typeof task.aiEvaluation.plan === 'number') {
                    sumPlan += task.aiEvaluation.plan;
                    sumMonitor += task.aiEvaluation.monitor;
                    sumEval += task.aiEvaluation.evaluate;
                    valid++;
                }
            }
            const avgPlan = valid ? (sumPlan/valid).toFixed(1) : 0;
            const avgMonitor = valid ? (sumMonitor/valid).toFixed(1) : 0;
            const avgEval = valid ? (sumEval/valid).toFixed(1) : 0;
            report.push({
                studentId: sid,
                totalTasks: totalTasks,
                avgAIPlanScore: parseFloat(avgPlan),
                avgAIMonitorScore: parseFloat(avgMonitor),
                avgAIEvaluateScore: parseFloat(avgEval),
                summary: `AI评分: 计划${avgPlan}分, 监控${avgMonitor}分, 评估${avgEval}分`
            });
        }
        const fullReport = { generatedAt: new Date().toISOString(), studentReports: report };
        const blob = new Blob([JSON.stringify(fullReport, null, 2)], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `metacog_analysis_report_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        alert("分析报告已导出");
    }
    function clearChatDisplay() {
        while (chatArea.firstChild) chatArea.removeChild(chatArea.firstChild);
        conversationHistory = [];
        if (currentStudentId && currentTaskObject) {
            coachSay(`对话已清空，继续当前任务: ${currentTaskObject.type}`, false);
            if (currentStage === "TASK_PUBLISHED") coachSay(currentTaskObject.description, "task-card");
            else if (currentStage === "METACOG_ACTIVE") coachSay("请继续回答元认知问题。");
        } else if (!currentStudentId) coachSay("请切换学号开始训练。");
    }
    
    const ADMIN_CODE = "20242091004";
    function showAdminLogin() {
        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = `<div class="modal-card"><h3>🔐 管理员验证</h3><input type="password" id="adminCodeInput" placeholder="管理员学号" style="width:100%; padding:10px; margin:15px 0;"><div><button id="cancelAdminBtn" class="btn-secondary">取消</button><button id="verifyAdminBtn" class="btn">确认</button></div></div>`;
        document.body.appendChild(modal);
        const cancel = modal.querySelector("#cancelAdminBtn");
        const verify = modal.querySelector("#verifyAdminBtn");
        const input = modal.querySelector("#adminCodeInput");
        cancel.onclick = () => modal.remove();
        verify.onclick = () => {
            if (input.value.trim() === ADMIN_CODE) { modal.remove(); showAdminDashboard(); }
            else { alert("学号错误"); modal.remove(); }
        };
    }
    function showAdminDashboard() {
        const studentsList = Object.values(allStudentsData);
        let tableRows = "";
        for (let st of studentsList) {
            let totalTasks = st.tasksCompleted.length;
            let sumPlan = 0, sumMonitor = 0, sumEval = 0;
            let valid = 0;
            for (let task of st.tasksCompleted) {
                if (task.aiEvaluation && typeof task.aiEvaluation.plan === 'number') {
                    sumPlan += task.aiEvaluation.plan;
                    sumMonitor += task.aiEvaluation.monitor;
                    sumEval += task.aiEvaluation.evaluate;
                    valid++;
                }
            }
            const avgPlan = valid ? (sumPlan/valid).toFixed(1) : "N/A";
            const avgMonitor = valid ? (sumMonitor/valid).toFixed(1) : "N/A";
            const avgEval = valid ? (sumEval/valid).toFixed(1) : "N/A";
            tableRows += `<tr><td>${st.studentId}</td><td>${st.createdAt.substring(0,10)}</td><td>${totalTasks}</td><td class="ai-score">${avgPlan}</td><td class="ai-score">${avgMonitor}</td><td class="ai-score">${avgEval}</td><td><button class="detail-btn" data-sid="${st.studentId}">查看详细与AI评语</button></td></tr>`;
        }
        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = `
            <div class="modal-card" style="max-width:1000px;">
                <div class="admin-export-buttons">
                    <button id="adminExportDetailBtn" class="btn">📄 导出明细</button>
                    <button id="adminExportReportBtn" class="btn-secondary">📊 导出分析报告</button>
                </div>
                <h3>📊 学生元认知AI评分汇总 (0-10分)</h3>
                <table class="student-table">
                    <thead><tr><th>学号</th><th>注册日期</th><th>完成任务数</th><th>AI计划分</th><th>AI监控分</th><th>AI评估分</th><th>操作</th></tr></thead>
                    <tbody>${tableRows || "<tr><td colspan='7'>暂无数据</td></tr>"}</tbody>
                </table>
                <div class="close-modal"><button id="closeAdminModal" class="btn-secondary">关闭</button></div>
                <div id="studentDetailArea" style="margin-top:20px;"></div>
            </div>`;
        document.body.appendChild(modal);
        modal.querySelector("#closeAdminModal").onclick = () => modal.remove();
        modal.querySelector("#adminExportDetailBtn").onclick = () => { exportDetail(); };
        modal.querySelector("#adminExportReportBtn").onclick = () => { exportAnalysisReport(); };
        modal.querySelectorAll(".detail-btn").forEach(btn => {
            btn.onclick = () => {
                const sid = btn.getAttribute("data-sid");
                const student = allStudentsData[sid];
                if (!student) return;
                let tasksHtml = "<h4>📋 任务记录及AI评判详情</h4><ul>";
                student.tasksCompleted.forEach((t, idx) => {
                    const ev = t.aiEvaluation || {};
                    tasksHtml += `<li><strong>任务${idx+1}: ${t.taskType}</strong> (${t.completedAt.substring(0,16)})<br>
                    AI评分: 计划${ev.plan||'?'}分, 监控${ev.monitor||'?'}分, 评估${ev.evaluate||'?'}分<br>
                    评语: ${ev.comment || '无'}<br>
                    学生答案摘要: ${t.studentAnswer.substring(0,80)}...</li>`;
                });
                tasksHtml += "</ul>";
                modal.querySelector("#studentDetailArea").innerHTML = `<div style="background:#f9f9f9; padding:12px; border-radius:16px;"><strong>${sid} 的详细记录</strong>${tasksHtml}</div>`;
            };
        });
    }
    
    sendBtn.addEventListener("click", handleUserMessage);
    completeTaskBtn.addEventListener("click", handleTaskComplete);
    switchStudentBtn.addEventListener("click", showLoginModal);
    clearCurrentChatBtn.addEventListener("click", clearChatDisplay);
    adminPanelBtn.addEventListener("click", showAdminLogin);
    messageInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleUserMessage(); });
    
    loadAllData();
    const lastId = localStorage.getItem("metaCoach_lastStudentId_v8");
    if (lastId && allStudentsData[lastId]) switchToStudent(lastId);
    else {
        studentIdDisplay.innerText = "未登录";
        // 按照要求修改开场白
        coachSay("🧑‍🏫 欢迎！我是小思。请点击右上角「切换学号」输入学号开始专属元认知监控训练。", false);
    }
    window.addEventListener("beforeunload", () => { if(currentStudentId) localStorage.setItem("metaCoach_lastStudentId_v8", currentStudentId); });
</script>
</body>
</html>
